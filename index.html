<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2933">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Приложение больше не доступно</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { height: 100%; margin: 0; background: #1F2933; color: #cfd6de; font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  </style>
</head>
<body>
  <p>Приложение больше не доступно</p>
  <script>
    (async () => {
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      try {
        if (indexedDB.databases) {
          for (const db of await indexedDB.databases()) { if (db.name) indexedDB.deleteDatabase(db.name); }
        }
      } catch (e) {}
      try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
      try { if ('serviceWorker' in navigator) await navigator.serviceWorker.register('sw.js'); } catch (e) {}
    })();
  </script>
</body>
</html>
