<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Промбез"><style>:root{padding-bottom:env(safe-area-inset-bottom,0px)}body{-webkit-tap-highlight-color:transparent}.hub-back{display:inline-block;margin:0 0 12px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none}.hub-back:hover{color:var(--ink)}
</style><title>Промбез тренажёр</title>
<meta name="theme-color" content="#1d2733">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна колонка ~680px, как карточка-бланк; сверху штамп-шапка, внизу крупные кнопки ответа */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#1d2733; --muted:#5d6874; --line:#d5d9d3;
  --signal:#f2b705; --signal-ink:#1d2733; --ok:#1f8a4c; --ok-bg:#e3f3e8; --bad:#c23b2a; --bad-bg:#fbe6e2;
  --font-display:"Golos Text","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:"Golos Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a21; --surface:#1d252e; --ink:#e7eae6; --muted:#9aa4ae; --line:#2f3a45;
  --signal:#f2b705; --signal-ink:#141a21; --ok:#4cc27d; --ok-bg:#173526; --bad:#ef6b5a; --bad-bg:#3b1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a21; --surface:#1d252e; --ink:#e7eae6; --muted:#9aa4ae; --line:#2f3a45;
  --signal:#f2b705; --signal-ink:#141a21; --ok:#4cc27d; --ok-bg:#173526; --bad:#ef6b5a; --bad-bg:#3b1f1b; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga";margin:0;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}


.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

/* режимы */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode b{font-weight:600;font-size:15.5px}
.mode span{color:var(--muted);font-size:13px;line-height:1.35}
.mode.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.primary span{color:inherit;opacity:.75}
.mode:disabled{opacity:.5;cursor:default}
.mode:not(:disabled):hover{border-color:var(--ink)}
@media (max-width:520px){.modes{grid-template-columns:1fr}}

/* билеты */
.tickets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tk:hover{border-color:var(--ink)}
.tk .n{font:600 21px/1 var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tk .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tk.done .s{color:var(--ok);font-weight:600}
.tk.part .s{color:var(--bad);font-weight:600}
@media (max-width:420px){.tickets{grid-template-columns:repeat(5,1fr);gap:6px}.tk .n{font-size:18px}}
.hint{color:var(--muted);font-size:13px;margin-top:22px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* вопрос */
.bar{display:flex;align-items:center;gap:12px;padding-block:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.back{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
.where{font-weight:600;font-size:14px;flex:1;min-width:0}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.cells{display:flex;gap:3px;margin-bottom:18px}
.cells i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.cells i.cur{background:var(--ink)}
.cells i.ok{background:var(--ok)}
.cells i.bad{background:var(--bad)}
.qsrc{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qtext{font-size:clamp(18px,4.4vw,20px);line-height:1.42;font-weight:600;letter-spacing:-.005em;margin:6px 0 18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;width:100%}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;line-height:1}
.opt .t{min-width:0;padding-top:2px}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.verdict{margin-top:16px;font-weight:700;min-height:1.5em}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.next{margin-top:10px;width:100%;background:var(--signal);color:var(--signal-ink);border:0;border-radius:10px;padding:15px;font-weight:600;font-size:16px}
.kbd{color:var(--muted);font-size:12px;margin-top:10px;text-align:center}
@media (hover:none){.kbd{display:none}}

/* итог */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:22px 4px}
.score .big{font:600 clamp(48px,14vw,68px)/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .of{font-size:18px;color:var(--muted)}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;padding:4px 10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;transform:rotate(-3deg)}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.actions button{flex:1 1 180px;border-radius:10px;padding:13px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.actions .go{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.misslist{display:flex;flex-direction:column;gap:8px}
.miss .q{font-weight:600}
.miss .y{color:var(--bad);font-size:14px}
.miss .c{color:var(--ok);font-size:14px}
/* цель и статистика */
.doc{padding-block:22px 20px;margin-bottom:6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.doc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ver{align-self:flex-start;margin-top:4px;display:flex;align-items:baseline;gap:8px;border:1.5px solid var(--muted);border-radius:6px;padding:5px 10px;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums}
.ver-n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.ver-d{font-size:12px}
.doc h1{font:600 clamp(19px,4.8vw,23px)/1.32 var(--font-display);margin:0;letter-spacing:-.012em;text-wrap:balance}
.doc-app{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);max-width:60ch;text-wrap:pretty}
.goal{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
button.goal:hover{border-color:var(--ink)}
.goal-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal-pct{font:600 clamp(36px,9vw,44px)/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.goal-cap{color:var(--muted);font-size:14px;flex:1;min-width:0}
.goal-more{font-size:13px;font-weight:600;color:var(--muted)}
.meter{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.meter i{min-width:0;background:var(--line)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)}
.goal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:0}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.tbar{width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.tbar i{display:block;height:100%;background:var(--ok)}
.modes{grid-template-columns:repeat(2,1fr)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.nums div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.nums b{font:600 22px/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--muted);line-height:1.3}
.tstat{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}
.trow{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:12px;background:none;border:0;border-radius:6px;padding:8px;text-align:left}
.trow:hover{background:var(--bg)}
.tn{font-size:14px;font-weight:600}
.tb{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.tb i{display:block;height:100%;background:var(--signal)}
.tb i.full{background:var(--ok)}
.tv{font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.spark{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.spark svg{display:block;width:100%;height:110px}
.spark .g{stroke:var(--line);stroke-dasharray:4 4}
.spark .g100{stroke:var(--ok);stroke-dasharray:4 4;opacity:.6}
.spark .area{fill:var(--signal);opacity:.18}
.spark .ln{fill:none;stroke:var(--signal);stroke-width:2.5}
.spark-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:11px;letter-spacing:0;text-transform:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.hrow{display:grid;grid-template-columns:1fr auto 56px;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.hrow:last-child{border-bottom:0}
.hd{color:var(--muted);font-size:12px}
.hv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hv.ok{color:var(--ok)}
@media (max-width:520px){.modes{grid-template-columns:1fr 1fr}.nums b{font-size:18px}}
/* вкладки и обратная связь */
.tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:12px 10px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-radius:8px;padding:9px 6px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
@media (max-width:380px){.tab{font-size:13px;padding-inline:4px}}
.fb-card{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.fb-k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fb-t{margin:0;max-width:60ch}
.tg{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--signal);color:var(--signal-ink);text-decoration:none;border-radius:10px;padding:12px 16px;font-weight:600}
.tg:hover{filter:brightness(1.05)}
.tg:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tg.big{padding:15px;font-size:16px}
.fb-link{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.fb-link span{user-select:all;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.rep-note{margin:0;font-size:13px;color:var(--muted)}
.rep-note.ok{color:var(--ok);font-weight:600}
.rep-pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.45 var(--font-body);user-select:all}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:60ch}
.about{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.about div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.about div:last-child{border-bottom:0}
.about span{color:var(--muted)} .about b{font-weight:600;text-align:right}
.report{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
#rep{width:100%;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
#rep[hidden]{display:none}
.rep-l{font-weight:600;font-size:14px}
#rep .tg{background:var(--ink);color:var(--bg)}
#rep textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;width:100%}
#rep textarea:focus{outline:2px solid var(--signal);border-color:transparent}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px)}}}
</style>

</head><body><div class="wrap" id="app"></div>

<script>
const DATA=[{"t":1,"q":[{"n":1,"text":"Что является сосудом, работающим под давлением (далее – СРД)?","opts":[{"l":"а","text":"сосуды и аппараты, работающие под избыточным давлением более 0,07 МПа: – пара, газа (в газообразном, сжиженном состоянии); – воды при температуре более 115°С;"},{"l":"б","text":"сосуды и аппараты, работающие под избыточным давлением более 0,07 МПа иных жидкостей при температуре, превышающих температуру их кипения при избыточном давлении 0,07 МПа;"},{"l":"в","text":"сосуды и аппараты, работающие под избыточным давлением до 0,07 МПа включительно, вакуумом с остаточным давлением 5 мм ртутного столба и выше, наливом и атмосферным давлением;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":2,"text":"С какой периодичностью проводится проверка знаний по безопасным методам выполнения работ рабочих обслуживающих СРД?","opts":[{"l":"а","text":"1 (один) раз в 12 (двенадцать) месяцев;"},{"l":"б","text":"1 (один) раз в 24 (двадцать четыре) месяца;"},{"l":"в","text":"1 (один) раз в 3 (три) года;"},{"l":"г","text":"1 (один) раз в 5 (пять) лет."}],"ans":"а"},{"n":3,"text":"Какого размера должна быть табличка на СРД?","opts":[{"l":"а","text":"форматом не менее 100 х 150 мм;"},{"l":"б","text":"форматом не менее 150 х 150 мм;"},{"l":"в","text":"форматом не менее 200 х 150 мм;"},{"l":"г","text":"форматом не менее 50 х 150 мм."}],"ans":"в"},{"n":4,"text":"Что содержится на табличках предохранительных клапанов?","opts":[{"l":"а","text":"номер клапана, разрешенное давление в аппарате – Рраз;"},{"l":"б","text":"место установки – номер структурного подразделения, обозначение аппарата, трубопровода по технологической схеме;"},{"l":"в","text":"установочное давление – Руст;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":5,"text":"В каких случаях необходимо немедленно остановить СРД?","opts":[{"l":"а","text":"Если в сосуде создавалось давление, не превышающее расчетное на 0,05 МПа (0,5 кгс/см2) для сосудов с давлением до 0,3 МПа (3 кгс/см2), на 15% – для сосудов с давлением от 0,3 до 6,0 МПа (от 3 до 60 кгс/см2) и на 10% – для сосудов с давлением свыше 6,0 МПа (60 кгс/см2);"},{"l":"б","text":"при выявлении неисправности предохранительных устройств от повышения давления;"},{"l":"в","text":"при обнаружении в сосуде и его элементах, работающих под давлением, неплотностей, выпучин, разрыва прокладок;"},{"l":"г","text":"при неисправности манометра и невозможности определить давление по другим приборам."},{"l":"д","text":"все вышеперечисленные"},{"l":"е","text":"б), в), г)"}],"ans":"е"},{"n":6,"text":"Давление рабочее – это:","opts":[{"l":"а","text":"максимальное избыточное давление, возникающее при нормальном протекании рабочего процесса;"},{"l":"б","text":"максимально допустимое избыточное давление для оборудования (элемента), установленное на основании оценки соответствия и/ или контрольного расчета на прочность;"},{"l":"в","text":"давление, на которое производится расчет на прочность оборудования;"},{"l":"г","text":"расчетное давление при температуре 20°С, используемое при расчете на прочность стандартных сосудов (узлов, деталей, арматуры)."}],"ans":"а"},{"n":7,"text":"С какой скоростью производится промывка технологических трубопроводов?","opts":[{"l":"а","text":"1 – 1,5 м/с, если иное не определено в проекте;"},{"l":"б","text":"1,5 – 2 м/с, если иное не определено в проекте;"},{"l":"в","text":"2 – 2,5 м/с, если иное не определено в проекте;"},{"l":"г","text":"2,5 – 3 м/с, если иное не определено в проекте."}],"ans":"а"},{"n":8,"text":"Каким давлением следует производить продувку технологических трубопроводов?","opts":[{"l":"а","text":"давлением, равным рабочему, но не более 4 МПа (40 кгс/см2);"},{"l":"б","text":"давлением, равным рабочему, но не более 2 МПа (20 кгс/см2);"},{"l":"в","text":"давлением не более 0,1 МПа (1 кгс/см2), для трубопроводов, работающих под избыточным давлением до 0,1 МПа (1 кгс/см2) или вакуумом;"},{"l":"г","text":"давлением не более 0,05 МПа (0,5 кгс/см2), для трубопроводов, работающих под избыточным давлением до 0,1 МПа (1 кгс/см2) или вакуумом;"},{"l":"д","text":"а) и в)"},{"l":"е","text":"б) и г)"}],"ans":"д"},{"n":9,"text":"В каких случаях необходимо немедленно остановить технологический трубопровод?","opts":[{"l":"а","text":"если давление в трубопроводе поднялось выше разрешенного и не снижается, несмотря на меры, принятые персоналом;"},{"l":"б","text":"при выявлении неисправности предохранительных устройств от повышения давления;"},{"l":"в","text":"если в основных элементах трубопровода будут обнаружены трещины, выпучины, пропуски в их сварных швах, обрыв анкерного болта или связи;"},{"l":"г","text":"при неисправности манометра и невозможности определить давление по другим приборам."},{"l":"д","text":"все вышеперечисленные"}],"ans":"д"}]},{"t":2,"q":[{"n":1,"text":"Какая информация должна быть на информационной табличке СРД?","opts":[{"l":"а","text":"номер позиции, заводской номер, учетный номер, дата истечения срока безопасной эксплуатации;"},{"l":"б","text":"разрешенные параметры: давление (вакуум), кгс/см² (мм рт.ст.) (Рр), температура, °С (Тр);"},{"l":"в","text":"число, месяц и год следующих наружного и внутреннего осмотров и гидравлического испытания."},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":2,"text":"Что не обязан совершать персонал во время смены при эксплуатации СРД?","opts":[{"l":"а","text":"строго соблюдать режим;"},{"l":"б","text":"следить за исправностью и работоспособностью сосудов, запорных арматур, контрольно-измерительных приборов, предохранительных и блокировочных устройств, средств сигнализации и защиты;"},{"l":"в","text":"не допускать ведение ремонтных работ на действующем оборудовании (разгерметизация, подтяжка крепежных соединений фланцев и другие работы);"},{"l":"г","text":"ежесменно проводить техническое диагностирование на предмет выявления и уточнения характера и размера дефектов;"},{"l":"д","text":"проверять исправность заземления, состояние фундаментов сосудов и аппаратов."}],"ans":"г"},{"n":3,"text":"Как сосуды, работающие под давлением и относящееся к ним оборудование, проверяются сменным персоналом в течение смены?","opts":[{"l":"а","text":"внешним осмотром на состояние изоляции, самих сосудов и их чистоту, на наличие на сосудах табличек с учетным номером и сроками следующего технического освидетельствования;"},{"l":"б","text":"внешним осмотром на наличие и исправность контрольно-измерительных приборов, в т. ч. работоспособность средств контроля уровня, температуры, давления в сосуде и при возможности сравнить показания первичных и вторичных приборов. Параметры технологического режима должны быть в пределах нормы и наличие четкой маркировки на всех приборах и арматурах;"},{"l":"в","text":"внешним осмотром на наличие на сосуде предохранительного устройства, наличие пломб со сроком проверки на предохранительных клапанах, исправность блокирующего устройства, не позволяющего отсекать предохранительный клапан арматурой. Запорная арматура на подводящих и отводящих трубопроводах должна быть открыта и отсутствие пропусков во фланцевых соединениях и сальниковых уплотнениях запорных арматур;"},{"l":"г","text":"внешним осмотром на наличие предохранительных устройств на сосуде. Запорная арматура на подводящих и отводящих трубопроводах предохранительных устройств должна быть открыта. В корпусе сосуда и в сварных швах должны отсутствовать трещины, пропуски, вмятины, на фланцевых соединениях и люках должны быть установлены все болты, на исправность пробоотборников, дренажных устройств, свободные фланцы дренажных и сливных устройств должны быть отглушены стандартными заглушками с записью в журнале установки и снятия заглушек;"},{"l":"д","text":"все вышеперечисленное."}],"ans":"д"},{"n":4,"text":"Чем оснащается СРД от повышения давления выше допустимого значения?","opts":[{"l":"а","text":"приборами для измерения давления;"},{"l":"б","text":"предохранительными устройствами;"},{"l":"в","text":"запорной или запорно-регулирующей арматурой;"},{"l":"г","text":"все вышепе  предохранительными устройствами и указателями уровня жидкости;"},{"l":"в","text":"запорной или запорно-регулирующей арматурой и предохранительными устройствами;"},{"l":"г","text":"а) и б)."}],"ans":"г"},{"n":3,"text":"Какую маркировку должна иметь запорная и запорно-регулирующая арматура?","opts":[{"l":"а","text":"наименование или товарный знак изготовителя;"},{"l":"б","text":"условный проход, мм и условное давление, МПа (допускается указывать рабочее давление и допустимую температуру);"},{"l":"в","text":"направление потока среды и марку материала корпуса;"},{"l":"г","text":"все вышеперечисленное"}],"ans":"г"},{"n":4,"text":"Ремонтные работы – это:","opts":[{"l":"а","text":"комплекс работ восстановительного характера, включающий строительные, монтажные, пусконаладочные работы;"},{"l":"б","text":"комплекс работ аварийно-восстановительного характера, включающий строительные, монтажные работы, а также техническое диагностирование оборудования;"},{"l":"в","text":"комплекс работ по восстановлению исправности или работоспособности объектов и восстановлению ресурсов технических устройств (объектов), а также их составных частей, включая проведение газоопасных, огневых, земляных работ, строительных, монтажных, пусконаладочных работ, а также работ по техническому диагностированию оборудования."}],"ans":"в"},{"n":5,"text":"Что должно быть выбито на выступающей части хвостовика заглушки?","opts":[{"l":"а","text":"номер подразделения, порядковый номер;"},{"l":"б","text":"номер подразделения, порядковый номер, условный диаметр, условное давление;"},{"l":"в","text":"номер подразделения, порядковый номер, условный диаметр;"},{"l":"г","text":"порядковый номер, условный диаметр, условное давление."}],"ans":"б"},{"n":6,"text":"Давление расчетное– это:","opts":[{"l":"а","text":"максимальное избыточное давление, возникающее при нормальном протекании рабочего процесса;"},{"l":"б","text":"максимально допустимое избыточное давление для оборудования (элемента), установленное на основании оценки соответствия и/ или контрольного расчета на прочность;"},{"l":"в","text":"давление, на которое производится расчет на прочность оборудования;"},{"l":"г","text":"расчетное давление при температуре 20°С, используемое при расчете на прочность стандартных сосудов (узлов, деталей, арматуры)."}],"ans":"в"},{"n":7,"text":"Что является письменным разрешением на проведение ремонтных работ на действующем производстве?","opts":[{"l":"а","text":"наряд-допуск;"},{"l":"б","text":"приказ по предприятию;"},{"l":"в","text":"распоряжение по предприятию."}],"ans":"а"},{"n":8,"text":"При соблюдении какого требования выдается наряд-допуск на проведение ремонтных работ?","opts":[{"l":"а","text":"после оформления акта сдачи-приемки объекта в ремонт;"},{"l":"б","text":"после выполнения всех мероприятий, предусмотренных планом подготовительных работ;"},{"l":"в","text":"после проверки выполнения всех мероприятий, предусмотренных планом подготовительных работ."}],"ans":"а"},{"n":9,"text":"Какого размера должна быть табличка на СРД?","opts":[{"l":"а","text":"форматом не менее 100 х 150 мм;"},{"l":"б","text":"форматом не менее 150 х 150 мм;"},{"l":"в","text":"форматом не менее 200 х 150 мм;"},{"l":"г","text":"форматом не менее 50 х 150 мм."}],"ans":"в"}]},{"t":4,"q":[{"n":1,"text":"Какой класс точности должны иметь манометры, устанавливаемые на СРД?","opts":[{"l":"а","text":"не ниже: 3,5 – при рабочем давлении сосуда до 2,5 МПа (25 кгс/см2), 2,5 – при рабочем давлении сосуда выше 2,5 МПа (25 кгс/см2);"},{"l":"б","text":"не ниже: 1,5 – при рабочем давлении сосуда до 2,5 МПа (25 кгс/см2), 0,5 – при рабочем давлении сосуда выше 2,5 МПа (25 кгс/см2);"},{"l":"в","text":"не ниже: 2,5 – при рабочем давлении сосуда до 2,5 МПа (25 кгс/см2), 1,5 – при рабочем давлении сосуда выше 2,5 МПа (25 кгс/см2);"}],"ans":"в"},{"n":2,"text":"В каком делении манометра должен находится предел измерения рабочего давления?","opts":[{"l":"а","text":"предел измерения рабочего давления должен находиться во второй трети шкалы;"},{"l":"б","text":"предел измерения рабочего давления должен находиться во второй шестой шкалы;"},{"l":"в","text":"предел измерения рабочего давления должен находиться в первой половине шкалы;"},{"l":"г","text":"не регламентируется."}],"ans":"а"},{"n":3,"text":"Номинальный диаметр корпуса манометров должен быть:","opts":[{"l":"а","text":"для устанавливаемых на высоте до 2 м от уровня площадки наблюдения за ними, должен быть не менее 100 мм;"},{"l":"б","text":"для устанавливаемых на высоте более 3 от уровня площадки наблюдения за ними, должен быть не менее 200 мм;"},{"l":"в","text":"для устанавливаемых на высоте от 2 до 3 м от уровня площадки наблюдения за ними, должен быть не менее 160 мм;"},{"l":"г","text":"а) и в);"},{"l":"д","text":"а), б) и в);"}],"ans":"г"},{"n":4,"text":"Чем оснащается СРД от повышения давления выше допустимого значения?","opts":[{"l":"а","text":"приборами для измерения давления;"},{"l":"б","text":"предохранительными устройствами;"},{"l":"в","text":"запорной или запорно-регулирующей арматурой;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"б"},{"n":5,"text":"Что должно быть выбито на выступающей части хвостовика заглушки?","opts":[{"l":"а","text":"номер подразделения, порядковый номер;"},{"l":"б","text":"номер подразделения, порядковый номер, условный диаметр, условное давление;"},{"l":"в","text":"номер подразделения, порядковый номер, условный диаметр;"},{"l":"г","text":"порядковый номер, условный диаметр, условное давление."}],"ans":"б"},{"n":6,"text":"Давление условное– это:","opts":[{"l":"а","text":"максимальное избыточное давление, возникающее при нормальном протекании рабочего процесса;"},{"l":"б","text":"максимально допустимое избыточное давление для оборудования (элемента), установленное на основании оценки соответствия и/ или контрольного расчета на прочность;"},{"l":"в","text":"давление, на которое производится расчет на прочность оборудования;"},{"l":"г","text":"расчетное давление при температуре 20°С, используемое при расчете на прочность стандартных сосудов (узлов, деталей, арматуры)."}],"ans":"г"},{"n":7,"text":"В какие сроки проводятся проверка правильности эксплуатации предохранительных клапанов?","opts":[{"l":"а","text":"ежемесячно – обслуживающим персоналом производственного объекта;"},{"l":"б","text":"периодически, по утвержденному плану-графику, ответственным за осуществление производственного контроля, за соблюдением требований промышленной безопасности сосудов, трубопроводов;"},{"l":"в","text":"ежесменно – обслуживающим персоналом производственного объекта;"},{"l":"г","text":"раз в квартал – обслуживающим персоналом производственного объекта"}],"ans":"в"},{"n":8,"text":"Критерии успешной очистки внутренней поверхности трубопровода является","opts":[{"l":"а","text":"проходимость всех участков трубопроводов очищаемого контура и в последующем после производства работ по обратной сборке всех контуров в подсистему и систему, а также чистота внутренней поверхности трубопроводов очищаемого контура;"},{"l":"б","text":"отсутствие строительного мусора, пыли, грязи, окалины, влаги в полости трубопроводов (при очистке воздухом);"},{"l":"в","text":"отсутствие механических примесей в сбросном воздухе, воде и частиц в соответствии с классом чистоты;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":9,"text":"С какой периодичностью осуществляется наблюдение и контроль исправного состояния трубопроводов?","opts":[{"l":"а","text":"не реже одного раза в смену;"},{"l":"б","text":"не реже одного раза в день;"},{"l":"в","text":"раз в два часа;"},{"l":"г","text":"нет правильного ответа."}],"ans":"а"}]},{"t":5,"q":[{"n":1,"text":"Манометр не допускается к применению в случаях, когда","opts":[{"l":"а","text":"отсутствует пломба или клеймо с отметкой о проведении поверки и просрочен срок поверки;"},{"l":"б","text":"стрелка при его отключении не возвращается к нулевому показанию шкалы на величину, превышающую половину допустимой погрешности для данного прибора;"},{"l":"в","text":"разбито стекло или имеются повреждения, которые могут отразиться на правильности его показаний;"},{"l":"г","text":"все вышеперечисленные."}],"ans":"г"},{"n":2,"text":"С какой периодичностью должна производиться поверка манометров с их опломбированием или клеймением?","opts":[{"l":"а","text":"регламентируется паспортом на манометр;"},{"l":"б","text":"не реже 1 (одного) раза в 24 (двадцать четыре) месяца;"},{"l":"в","text":"не реже 1 (одного) раза в 12 (двенадцать) месяцев;"},{"l":"г","text":"нет правильного ответа."}],"ans":"в"},{"n":3,"text":"Что не обязан совершать персонал во время смены при эксплуатации СРД?","opts":[{"l":"а","text":"не допускать посторонних лиц на рабочее место;"},{"l":"б","text":"контролировать действия обслуживающего и ремонтного персонала, обязательно указывать на допущенные ими при выполнении работ нарушения правил безопасной эксплуатации сосудов, разъяснять возможные последствия этих нарушений;"},{"l":"в","text":"знать, а также умело и быстро выполнять мероприятия, предусмотренные планом мероприятий по локализации и ликвидации последствий аварий (далее – ПМЛА) при различных авариях;"},{"l":"г","text":"ежесменно проводить продувку сосуда для предотвращения образования газогидратов;"},{"l":"д","text":"докладывать непосредственному руководителю о выявленных неисправностях сосудов, запорных арматур, контрольно-измерительных приборов, предохранительных и блокировочных устройств, средств сигнализации и защиты, а также о возникновении отклонений в ведении технологического процесса или при выполнении производственных операций."}],"ans":"г"},{"n":4,"text":"Что необходимо при выводе СРД в ремонт, а также перед внутренним осмотром?","opts":[{"l":"а","text":"– прекратить прием продуктов; – полностью освободить оборудование от продуктов; – отключить электроэнергию (при наличии электрооборудования); – продуть сосуд инертным газом (азотом);"},{"l":"б","text":"– установить заглушки согласно схемам, приложенным к наряд-допуску на производство ремонтных или газоопасных работ и к распоряжению на останов (с записью в журнале снятия и установки заглушек); – пропарить сосуд в закрытую систему, согласно схемы, приложенной к наряд-допуску на производство ремонтных или газоопасных работ. Пропарку вести с учетом расчетных параметров сосуда;"},{"l":"в","text":"– охладить сосуд до температуры ниже 30°С; – проанализировать воздушную среду из аппарата на отсутствие вредных веществ, превышающих предельно-допустимую концентрацию и содержание кислорода;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":5,"text":"В присутствии кого должна начинаться газоопасная работа?","opts":[{"l":"а","text":"в присутствии лица, ответственного за проведение работ;"},{"l":"б","text":"в присутствии главного инженера и начальника службы охраны труда;"},{"l":"в","text":"в присутствии технического руководителя организации и начальника смены;"},{"l":"г","text":"в присутствии начальника производства и лица, ответственного за проведение подготовительных работ."}],"ans":"а"},{"n":6,"text":"Какие требования предъявляются к лицам, допущенным к выполнению газоопасных работ?","opts":[{"l":"а","text":"должны быть не моложе 18 лет;"},{"l":"б","text":"не должны иметь медицинских противопоказаний к указанным видам работ;"},{"l":"в","text":"должны пройти обучение безопасным методам и приемам выполнения работ;"},{"l":"г","text":"должны знать токсические свойства веществ в местах проведения работ и их действие на организм;"},{"l":"д","text":"все перечисленные требования;"},{"l":"е","text":"а) и в)."}],"ans":"д"},{"n":7,"text":"Какое остаточное давление азота в системах должно оставаться после окончания инертизации?","opts":[{"l":"а","text":"должно равняться 0,02 ÷ 0,1 МПа;"},{"l":"б","text":"должно равняться 0,1 ÷ 0,2 МПа;"},{"l":"в","text":"остаточного давления остаться не должно;"},{"l":"г","text":"2,5 – 3 м/с, если иное не определено в проекте."}],"ans":"а"},{"n":8,"text":"Какая периодичность полного технического освидетельствования установлена для подъемного сооружения в течение всего срока службы?","opts":[{"l":"а","text":"не реже одного раза в 3 года, за исключением редко используемых ПС.;"},{"l":"б","text":"не реже 1 раза в 5 лет, за исключением редко используемых ПС;"},{"l":"в","text":"не реже 1 раза в 6 лет;"},{"l":"г","text":"не реже 1 раза в 8 лет."}],"ans":"а"},{"n":9,"text":"Для управления работой и обеспечения безопасных условий эксплуатации сосуды в зависимости от назначения должны быть оснащены:","opts":[{"l":"а","text":"запорной или запорно-регулирующей арматурой и приборами для измерения давления;"},{"l":"б","text":"приборами для измерения температуры, предохранительными устройствами и указателями уровня жидкости;"},{"l":"в","text":"запорной или запорно-регулирующей арматурой и предохранительными устройствами;"},{"l":"г","text":"а) и б)."}],"ans":"г"}]},{"t":6,"q":[{"n":1,"text":"На какую высоту следует предварительно поднять груз перед началом перемещения (с последующей остановкой) для проверки правильности строповки и надежности действия тормоза подъемного сооружения?","opts":[{"l":"а","text":"не более 200 - 300 мм;"},{"l":"б","text":"не более 300 - 500 мм;"},{"l":"в","text":"не более 450 - 550 мм;"},{"l":"г","text":"не более 550 - 750 мм."}],"ans":"а"},{"n":2,"text":"С какой периодичностью проводится проверка знаний по безопасным методам выполнения работ рабочих обслуживающих СРД?","opts":[{"l":"а","text":"1 (один) раз в 12 (двенадцать) месяцев;"},{"l":"б","text":"1 (один) раз в 24 (двадцать четыре) месяца;"},{"l":"в","text":"1 (один) раз в 3 (три) года;"},{"l":"г","text":"1 (один) раз в 5 (пять) лет."}],"ans":"а"},{"n":3,"text":"Каков порядок проверки исправности предохранительных клапанов, установленных на паре, азоте, воздухе?","opts":[{"l":"а","text":"принудительным кратковременным их «подрывом» 1 (один) раз в сутки с записью в вахтовом журнале;"},{"l":"б","text":"принудительным кратковременным их «подрывом» 1 (один) раз в смену с записью в вахтовом журнале;"},{"l":"в","text":"принудительным кратковременным их «подрывом» 1 (один) раз в 2 (два) часа с записью в вахтовом журнале;"},{"l":"г","text":"визуальным осмотром с записью в вахтовом журнале."}],"ans":"б"},{"n":4,"text":"Какова периодичность пересмотра и переутверждения перечня газоопасных работ?","opts":[{"l":"а","text":"не реже одного раза в 5 лет;"},{"l":"б","text":"не реже одного раза в 3 года;"},{"l":"в","text":"не реже одного раза в 2 года;"},{"l":"г","text":"не реже одного раза в год."}],"ans":"г"},{"n":5,"text":"Когда могут проводиться газоопасные работы, выполняемые по наряду-допуску?","opts":[{"l":"а","text":"во время грозы;"},{"l":"б","text":"только в темное время суток с соблюдением мероприятий по обеспечению безопасного проведения работ, учитывающих условия их выполнения в темное время суток;"},{"l":"в","text":"в рабочие дни в дневное время (дневную рабочую смену) или по письменному разрешению лица, утвердившего наряд-допуск на проведение газоопасных работ, в темное время суток (вечернюю и ночную рабочую смену), а также в выходные и праздничные дни в присутствии представителя ГСС;"},{"l":"г","text":"в дневное или в темное время суток с участием или в присутствии лица, ответственного за выполнение газоопасных работ."}],"ans":"в"},{"n":6,"text":"Давление рабочее – это:","opts":[{"l":"а","text":"максимальное избыточное давление, возникающее при нормальном протекании рабочего процесса;"},{"l":"б","text":"максимально допустимое избыточное давление для оборудования (элемента), установленное на основании оценки соответствия и/ или контрольного расчета на прочность;"},{"l":"в","text":"давление, на которое производится расчет на прочность оборудования;"},{"l":"г","text":"расчетное давление при температуре 20°C, используемое при расчете на прочность стандартных сосудов (узлов, деталей, арматуры)."}],"ans":"а"},{"n":7,"text":"С какой скоростью производится промывка технологических трубопроводов?","opts":[{"l":"а","text":"1 – 1,5 м/с, если иное не определено в проекте;"},{"l":"б","text":"1,5 – 2 м/с, если иное не определено в проекте;"},{"l":"в","text":"2 – 2,5 м/с, если иное не определено в проекте;"},{"l":"г","text":"2,5 – 3 м/с, если иное не определено в проекте."}],"ans":"а"},{"n":8,"text":"Каким давлением следует производить продувку технологических трубопроводов?","opts":[{"l":"а","text":"давлением, равным рабочему, но не более 4 МПа (40 кгс/см2);"},{"l":"б","text":"давлением, равным рабочему, но не более 2 МПа (20 кгс/см2);"},{"l":"в","text":"давлением не более 0,1 МПа (1 кгс/см2), для трубопроводов, работающих под избыточным давлением до 0,1 МПа (1 кгс/см2) или вакуумом;"},{"l":"г","text":"давлением не более 0,05 МПа (0,5 кгс/см2), для трубопроводов, работающих под избыточным давлением до 0,1 МПа (1 кгс/см2) или вакуумом;"},{"l":"д","text":"а) и в)"},{"l":"е","text":"б) и г)"}],"ans":"д"},{"n":9,"text":"В каких случаях необходимо немедленно остановить технологический трубопровод?","opts":[{"l":"а","text":"если давление в трубопроводе поднялось выше разрешенного и не снижается, несмотря на меры, принятые персоналом;"},{"l":"б","text":"при выявлении неисправности предохранительных устройств от повышения давления;"},{"l":"в","text":"если в основных элементах трубопровода будут обнаружены трещины, выпучины, пропуски в их сварных швах, обрыв анкерного болта или связи;"},{"l":"г","text":"при неисправности манометра и невозможности определить давление по другим приборам."},{"l":"д","text":"все вышеперечисленные"}],"ans":"д"}]},{"t":7,"q":[{"n":1,"text":"Какая информация должна быть на информационной табличке СРД?","opts":[{"l":"а","text":"номер позиции, заводской номер, учетный номер, дата истечения срока безопасной эксплуатации;"},{"l":"б","text":"разрешенные параметры: давление (вакуум), кгс/см² (мм рт.ст.) (Pр), температура, °C (Tр);"},{"l":"в","text":"число, месяц и год следующих наружного и внутреннего осмотров и гидравлического испытания."},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":2,"text":"Что не обязан совершать персонал во время смены при эксплуатации СРД?","opts":[{"l":"а","text":"строго соблюдать режим;"},{"l":"б","text":"следить за исправностью и работоспособностью сосудов, запорных арматур, контрольно-измерительных приборов, предохранительных и блокировочных устройств, средств сигнализации и защиты;"},{"l":"в","text":"не допускать ведение ремонтных работ на действующем оборудовании (разгерметизация, подтяжка крепежных соединений фланцев и другие работы);"},{"l":"г","text":"ежесменно проводить техническое диагностирование на предмет выявления и уточнения характера и размера дефектов;"},{"l":"д","text":"проверять исправность заземления, состояние фундаментов сосудов и аппаратов."}],"ans":"г"},{"n":3,"text":"Как сосуды, работающие под давлением и относящееся к ним оборудование, проверяются сменным персоналом в течение смены?","opts":[{"l":"а","text":"внешним осмотром на состояние изоляции, самих сосудов и их чистоту, на наличие на сосудах табличек с учетным номером и сроками следующего технического освидетельствования;"},{"l":"б","text":"внешним осмотром на наличие и исправность контрольно-измерительных приборов, в т. ч. работоспособность средств контроля уровня, температуры, давления в сосуде и при возможности сравнить показания первичных и вторичных приборов. Параметры технологического режима должны быть в пределах нормы и наличие четкой маркировки на всех приборах и арматурах;"},{"l":"в","text":"внешним осмотром на наличие на сосуде предохранительного устройства, наличие пломб со сроком проверки на предохранительных клапанах, исправность блокирующего устройства, не позволяющего отсекать предохранительный клапан арматурой. Запорная арматура на подводящих и отводящих трубопроводах должна быть открыта и отсутствие пропусков во фланцевых соединениях и сальниковых уплотнениях запорных арматур;"},{"l":"г","text":"внешним осмотром на наличие предохранительных устройств на сосуде. Запорная арматура на подводящих и отводящих трубопроводах предохранительных устройств должна быть открыта. В корпусе сосуда и в сварных швах должны отсутствовать трещины, пропуски, вмятины, на фланцевых соединениях и люках должны быть установлены все болты, на исправность пробоотборников, дренажных устройств, свободные фланцы дренажных и сливных устройств должны быть отглушены стандартными заглушками с записью в журнале установки и снятия заглушек;"},{"l":"д","text":"все вышеперечисленное."}],"ans":"д"},{"n":4,"text":"Чем оснащается СРД от повышения давления выше допустимого значения?","opts":[{"l":"а","text":"приборами для измерения давления;"},{"l":"б","text":"предохранительными устройствами;"},{"l":"в","text":"запорной или запорно-регулирующей арматурой;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"б"},{"n":5,"text":"Что необходимо при выводе СРД в ремонт, а также перед внутренним осмотром?","opts":[{"l":"а","text":"– прекратить прием продуктов; – полностью освободить оборудование от продуктов; – отключить электроэнергию (при наличии электрооборудования); – продуть сосуд инертным газом (азотом);"},{"l":"б","text":"– установить заглушки согласно схемам, приложенным к наряд-допуску на производство ремонтных или газоопасных работ и к распоряжению на останов (с записью в журнале снятия и установки заглушек); – пропарить сосуд в закрытую систему, согласно схемы, приложенной к наряд-допуску на производство ремонтных или газоопасных работ. Пропарку вести с учетом расчетных параметров сосуда;"},{"l":"в","text":"– охладить сосуд до температуры ниже 30°C; – проанализировать воздушную среду из аппарата на отсутствие вредных веществ, превышающих предельно-допустимую концентрацию и содержание кислорода;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":6,"text":"Давление разрешенное– это:","opts":[{"l":"а","text":"максимальное избыточное давление, возникающее при нормальном протекании рабочего процесса;"},{"l":"б","text":"максимально допустимое избыточное давление для оборудования (элемента), установленное на основании оценки соответствия и/ или контрольного расчета на прочность;"},{"l":"в","text":"давление, на которое производится расчет на прочность оборудования;"},{"l":"г","text":"расчетное давление при температуре 20°C, используемое при расчете на прочность стандартных сосудов (узлов, деталей, арматуры)."}],"ans":"б"},{"n":7,"text":"В какие сроки проводятся проверка правильности эксплуатации предохранительных клапанов?","opts":[{"l":"а","text":"ежемесячно – обслуживающим персоналом производственного объекта;"},{"l":"б","text":"периодически, по утвержденному плану-графику, ответственным за осуществление производственного контроля, за соблюдением требований промышленной безопасности сосудов, трубопроводов;"},{"l":"в","text":"ежесменно – обслуживающим персоналом производственного объекта;"},{"l":"г","text":"раз в квартал – обслуживающим персоналом производственного объекта"}],"ans":"в"},{"n":8,"text":"Критериями успешной очистки внутренней поверхности трубопровода является","opts":[{"l":"а","text":"проходимость всех участков трубопроводов очищаемого контура и в последующем после производства работ по обратной сборке всех контуров в подсистему и систему, а также чистота внутренней поверхности трубопроводов очищаемого контура;"},{"l":"б","text":"отсутствие строительного мусора, пыли, грязи, окалины, влаги в полости трубопроводов (при очистке воздухом);"},{"l":"в","text":"отсутствие механических примесей в сбросном воздухе, воде и частиц в соответствии с классом чистоты;"},{"l":"г","text":"все вышеперечисленное."}],"ans":"г"},{"n":9,"text":"С какой периодичностью осуществляется наблюдение и контроль исправного состояния трубопроводов?","opts":[{"l":"а","text":"не реже одного раза в смену;"},{"l":"б","text":"не реже одного раза в день;"},{"l":"в","text":"раз в два часа;"},{"l":"г","text":"нет правильного ответа."}],"ans":"а"}]},{"t":8,"q":[{"n":1,"text":"Надзор за техническим состоянием сосудов и аппаратов в период эксплуатации осуществляется наружным осмотром осуществляется?","opts":[{"l":"а","text":"обслуживающим персоналом ежесменно, с записью в вахтовом журнале;"},{"l":"б","text":"обслуживающим персоналом раз в два часа, с записью в журнале состояния СРД;"},{"l":"в","text":"ответственным за исправное состояние и безопасную эксплуатацию сосудов, раз в месяц;"},{"l":"г","text":"ответственным за исправное состояние и безопасную эксплуатацию сосудов, раз в квартал;"},{"l":"д","text":"а) и в)."}],"ans":"д"},{"n":2,"text":"Для управления работой и обеспечения безопасных условий эксплуатации сосуды в зависимости от назначения должны быть оснащены:","opts":[{"l":"а","text":"запорной или запорно-регулирующей арматурой и приборами для измерения давления;"},{"l":"б","text":"приборами для измерения температуры, предохранительными устройствами и указателями уровня жидкости;"},{"l":"в","text":"запорной или запорно-регулирующей арматурой и предохранительными устройствами;"},{"l":"г","text":"а) и б)."}],"ans":"г"},{"n":3,"text":"Какую маркировку должна иметь запорная и запорно-регулирующая арматура?","opts":[{"l":"а","text":"наименование или товарный знак изготовителя;"},{"l":"б","text":"условный проход, мм и условное давление, МПа (допускается указывать рабочее давление и допустимую температуру);"},{"l":"в","text":"направление потока среды и марку материала корпуса;"},{"l":"г","text":"все вышеперечисленное"}],"ans":"г"},{"n":4,"text":"Каким должно быть безопасное расстояние от низа перемещаемого груза до наиболее выступающих по вертикали частей здания или сооружения?","opts":[{"l":"а","text":"не менее 2,5 м.;"},{"l":"б","text":"не менее 1,5 м;"},{"l":"в","text":"не менее 1,0 м;"},{"l":"г","text":"не менее 0,5 м."}],"ans":"г"},{"n":5,"text":"Что должно быть выбито на выступающей части хвостовика заглушки?","opts":[{"l":"а","text":"номер подразделения, порядковый номер;"},{"l":"б","text":"номер подразделения, порядковый номер, условный диаметр, условное давление;"},{"l":"в","text":"номер подразделения, порядковый номер, условный диаметр;"},{"l":"г","text":"порядковый номер, условный диаметр, условное давление."}],"ans":"б"},{"n":6,"text":"Давление расчетное– это:","opts":[{"l":"а","text":"максимальное избыточное давление, возникающее при нормальном протекании рабочего процесса;"},{"l":"б","text":"максимально допустимое избыточное давление для оборудования (элемента), установленное на основании оценки соответствия и/ или контрольного расчета на прочность;"},{"l":"в","text":"давление, на которое производится расчет на прочность оборудования;"},{"l":"г","text":"расчетное давление при температуре 20°С, используемое при расчете на прочность стандартных сосудов (узлов, деталей, арматуры)."}],"ans":"в"},{"n":7,"text":"Каков максимальный срок единовременного пребывания работающего в средствах защиты органов дыхания?","opts":[{"l":"а","text":"60 минут;"},{"l":"б","text":"10 минут;"},{"l":"в","text":"15 минут;"},{"l":"г","text":"30 минут."}],"ans":"г"},{"n":8,"text":"В каком документе записываются результаты проверки обслуживающим персоналом состояния сосудов, арматуры, предохранительных устройств, контрольно-измерительных приборов, предохранительных и блокировочных устройств, средств сигнализации и защиты записываются?","opts":[{"l":"а","text":"в паспорте оборудования;"},{"l":"б","text":"в журнале КИПиА;"},{"l":"в","text":"в вахтовом журнале;"},{"l":"г","text":"во всех вышеперечисленных."}],"ans":"в"},{"n":9,"text":"Какого размера должна быть табличка на СРД?","opts":[{"l":"а","text":"форматом не менее 100 х 150 мм;"},{"l":"б","text":"форматом не менее 150 х 150 мм;"},{"l":"в","text":"форматом не менее 200 х 150 мм;"},{"l":"г","text":"форматом не менее 50 х 150 мм."}],"ans":"в"}]},{"t":9,"q":[{"n":1,"text":"Какой класс точности должны иметь манометры, устанавливаемые на СРД?","opts":[{"l":"а","text":"не ниже: 3,5 – при рабочем давлении сосуда до 2,5 МПа (25 кгс/см2), 2,5 – при рабочем давлении сосуда выше 2,5 МПа (25 кгс/см2);"},{"l":"б","text":"не ниже: 1,5 – при рабочем давлении сосуда до 2,5 МПа (25 кгс/см2), 0,5 – при рабочем давлении сосуда выше 2,5 МПа (25 кгс/см2);"},{"l":"в","t   <div class="label">Билеты</div>
  <div class="tickets">${DATA.map(t=>{const m=ticketOk(t.t),any=ALL.some(q=>q.t===t.t&&store.stat[q.id]);const cls=m==9?'done':(any?'part':'');
    return `<button class="tk ${cls}" data-t="${t.t}"><span class="n">${t.t}</span><span class="s">${any?m+' / 9':'—'}</span><span class="tbar"><i style="width:${m/9*100}%"></i></span></button>`}).join('')}</div>
  <p class="hint">Вопрос считается освоенным, если последний ответ на него был верным. Под номером билета — сколько его вопросов освоено. Устный 10-й вопрос в тренажёр не входит.
  ${store.sessions.length||w?' <button class="link" id="reset">Сбросить прогресс</button>':''}</p>
  </div>`;
  bindTabs();
  app.querySelector('#m-stats').onclick=stats;
  app.querySelector('#m-exam').onclick=()=>start('exam',shuffle(ALL).slice(0,9),'Экзамен');
  if(left)app.querySelector('#m-goal').onclick=()=>start('goal',shuffle(ALL.filter(q=>!(store.stat[q.id]&&store.stat[q.id].last))),'До 100%');
  app.querySelector('#m-all').onclick=()=>start('all',shuffle(ALL),'Все вопросы');
  const me=app.querySelector('#m-err');if(w)me.onclick=()=>start('err',shuffle(store.wrong.map(id=>byId[id]).filter(Boolean)),'Работа над ошибками');
  app.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{const n=+b.dataset.t;start('ticket',ALL.filter(q=>q.t===n),'Билет № '+n,n)});
  const r=app.querySelector('#reset');if(r)r.onclick=()=>{if(r.dataset.sure){store=fresh();save();home()}else{r.dataset.sure=1;r.textContent='Нажмите ещё раз, чтобы сбросить'}};
  window.scrollTo(0,0);
}
function summary(){let ok=0,bad=0,c=0,w=0;ALL.forEach(q=>{const r=store.stat[q.id];if(!r)return;c+=r.c;w+=r.w;if(r.last)ok++;else bad++});
  const n=ALL.length;return{ok,bad,none:n-ok-bad,n,pct:Math.floor(ok/n*100),answers:c+w,acc:c+w?Math.round(c/(c+w)*100):null}}
function ticketOk(t){return ALL.filter(q=>q.t===t&&store.stat[q.id]&&store.stat[q.id].last).length}
function meter(st){return `<div class="meter" role="img" aria-label="Освоено ${st.ok} из ${st.n}"><i class="ok" style="flex:${st.ok}"></i><i class="bad" style="flex:${st.bad}"></i><i style="flex:${st.none}"></i></div>`}
function stats(){
  S=null;const st=summary();
  const hard=ALL.filter(q=>store.stat[q.id]&&store.stat[q.id].w).sort((a,b)=>store.stat[b.id].w-store.stat[a.id].w||store.stat[a.id].last-store.stat[b.id].last).slice(0,8);
  const ses=store.sessions.slice(-12).reverse();
  const fmt=d=>{const x=new Date(d);return x.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  const trend=store.sessions.slice(-20);
  app.innerHTML=`${tabs('stats')}<div class="screen">
  <div class="goal static"><div class="goal-top"><span class="goal-pct">${st.pct}%</span><span class="goal-cap">${st.pct===100?'Цель достигнута: все 90 вопросов освоены':'освоено · до цели '+(st.n-st.ok)+' '+plural(st.n-st.ok,'вопрос','вопроса','вопросов')}</span></div>
  ${meter(st)}
  <div class="goal-legend"><span><i class="dot ok"></i>Освоено ${st.ok}</span><span><i class="dot bad"></i>С ошибкой ${st.bad}</span><span><i class="dot"></i>Не пройдено ${st.none}</span></div></div>
  <div class="nums">
    <div><b>${st.answers}</b><span>${plural(st.answers,'ответ дан','ответа дано','ответов дано')}</span></div>
    <div><b>${st.acc==null?'—':st.acc+'%'}</b><span>точность за всё время</span></div>
    <div><b>${store.sessions.length}</b><span>${plural(store.sessions.length,'попытка','попытки','попыток')} пройдено</span></div>
  </div>
  <div class="label">Освоено по билетам</div>
  <div class="tstat">${DATA.map(t=>{const m=ticketOk(t.t),b=store.best[t.t];return `<button class="trow" data-t="${t.t}"><span class="tn">Билет ${t.t}</span><span class="tb"><i style="width:${m/9*100}%" class="${m==9?'full':''}"></i></span><span class="tv">${m} / 9</span></button>`}).join('')}</div>
  ${trend.length>1?`<div class="label">Последние попытки, % верных</div>${spark(trend)}`:''}
  ${hard.length?`<div class="label">Трудные вопросы</div><div class="misslist">${hard.map(q=>{const r=store.stat[q.id];const o=q.opts.find(o=>o.l===q.ans);
    return `<div class="miss"><div class="qsrc">Билет ${q.t} · вопрос ${q.n} · ошибок ${r.w}, верно ${r.c} ${r.last?'<span class="chip ok">уже верно</span>':'<span class="chip bad">пока ошибка</span>'}</div><div class="q">${esc(q.text)}</div><div class="c">Правильно: ${q.ans}) ${esc(o?o.text:'')}</div></div>`}).join('')}</div>`:''}
  ${ses.length?`<div class="label">История</div><div class="hist">${ses.map(x=>`<div class="hrow"><span>${esc(x.title)}</span><span class="hd">${fmt(x.d)}</span><span class="hv ${x.good===x.tot?'ok':''}">${x.good} / ${x.tot}</span></div>`).join('')}</div>`:
   '<p class="hint">Пройдите первый билет или экзамен, и здесь появится история попыток.</p>'}
  </div>`;
  bindTabs();
  app.querySelectorAll('.trow').forEach(b=>b.onclick=()=>{const n=+b.dataset.t;start('ticket',ALL.filter(q=>q.t===n),'Билет № '+n,n)});
  window.scrollTo(0,0);
}
function spark(tr){const W=640,H=120,P=8,n=tr.length;const x=i=>P+i*(W-2*P)/(n-1),y=v=>H-P-v*(H-2*P);
  const pts=tr.map((s,i)=>[x(i),y(s.good/s.tot)]);const line=pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const last=pts[pts.length-1];
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Процент верных ответов в последних попытках">
  <line x1="${P}" x2="${W-P}" y1="${y(1)}" y2="${y(1)}" class="g100"/><line x1="${P}" x2="${W-P}" y1="${y(.5)}" y2="${y(.5)}" class="g"/>
  <polygon points="${P},${H-P} ${line} ${W-P},${H-P}" class="area"/><polyline points="${line}" class="ln" vector-effect="non-scaling-stroke"/></svg>
  <div class="spark-lab"><span>100%</span><span>последняя: ${Math.round(tr[n-1].good/tr[n-1].tot*100)}%</span></div></div>`}
const TG='https://t.me/+Dw9O7KxQAdI4M2Ri',VER='1.0';
function tabs(a){const t=[['home','Тренажёр'],['stats','Статистика'],['fb','Обратная связь']];
  return `<nav class="tabs" role="tablist">${t.map(([k,l])=>`<button role="tab" class="tab${k===a?' on':''}" aria-selected="${k===a}" data-tab="${k}">${l}</button>`).join('')}</nav>`}
function bindTabs(){app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>({home,stats,fb:feedback})[b.dataset.tab]())}
function copyText(txt,pre,note,okMsg){
  const show=()=>{pre.textContent=txt;pre.hidden=false;note.textContent='Не удалось скопировать автоматически. Выделите текст ниже и скопируйте вручную.'};
  try{navigator.clipboard.writeText(txt).then(()=>{note.textContent=okMsg;note.classList.add('ok')},show)}catch(e){show()}
}
function feedback(){
  S=null;
  app.innerHTML=`${tabs('fb')}<div class="screen">
  <div class="fb-card">
    <div class="fb-k">Telegram-канал тренажёра</div>
    <p class="fb-t">Новости, обновления билетов и обсуждение. Нашли ошибку в вопросе или ответе, есть идея — пишите в комментариях к постам канала.</p>
    <a class="tg big" href="${TG}" target="_blank" rel="noopener">Перейти в канал</a>
    <div class="fb-link"><span id="tg-url">${TG.replace('https://','')}</span><button class="link" id="tg-copy">Скопировать ссылку</button></div>
    <p class="rep-note" id="tg-note">Канал закрытый: по ссылке откроется Telegram с кнопкой вступления.</p>
    <pre class="rep-pre" id="tg-pre" hidden></pre>
  </div>
  <div class="label">Как сообщить об ошибке в вопросе</div>
  <ol class="steps">
    <li>Во время теста нажмите под вопросом «Сообщить об ошибке в вопросе».</li>
    <li>Напишите, что не так, и нажмите «Скопировать и открыть Telegram».</li>
    <li>В канале откройте комментарии к посту и вставьте сообщение: номер билета, вопрос и ответ по таблице подставятся сами.</li>
  </ol>
  <div class="label">О программе</div>
  <div class="about">
    <div><span>Версия</span><b>${VER} от${'\u00a0'}29.09.2026</b></div>
    <div><span>Билеты</span><b>10 × 9 вопросов, 90 всего</b></div>
    <div><span>Ответы</span><b>по таблице ответов из${'\u00a0'}программы</b></div>
  </div>
  </div>`;
  bindTabs();
  app.querySelector('#tg-copy').onclick=()=>copyText(TG,app.querySelector('#tg-pre'),app.querySelector('#tg-note'),'Ссылка скопирована.');
  window.scrollTo(0,0);
}
function start(mode,qs,title,ticket){S={mode,qs,title,ticket,i:0,res:[],picked:null};question()}
function question(){
  const q=S.qs[S.i];S.picked=null;
  app.innerHTML=`<div class="screen">
  <div class="bar"><button class="back" id="back">← Меню</button><div class="where">${esc(S.title)}</div><div class="count">${S.i+1} / ${S.qs.length}</div></div>
  ${S.qs.length<=30?`<div class="cells">${S.qs.map((_,k)=>`<i class="${k<S.i?(S.res[k].ok?'ok':'bad'):k==S.i?'cur':''}"></i>`).join('')}</div>`:
   `<div class="cells"><i class="ok" style="flex:${S.i}"></i><i style="flex:${S.qs.length-S.i}"></i></div>`}
  <div class="qsrc">Билет ${q.t} · вопрос ${q.n}</div>
  <div class="qtext">${esc(q.text)}</div>
  <div class="opts">${q.opts.map(o=>`<button class="opt" data-l="${o.l}"><span class="l">${o.l}</span><span class="t">${esc(o.text)}</span></button>`).join('')}</div>
  <div class="verdict" id="verdict" aria-live="polite"></div>
  <div id="nextbox"></div>
  <div class="report"><button class="link" id="rep-open" aria-expanded="false">Сообщить об ошибке в вопросе</button>
  <div id="rep" hidden>
    <label class="rep-l" for="rep-text">Что не так с вопросом или ответом?</label>
    <textarea id="rep-text" rows="3" placeholder="Например: по новым правилам правильный ответ «в»"></textarea>
    <a class="tg" id="rep-send" href="${TG}" target="_blank" rel="noopener">Скопировать и открыть Telegram</a>
    <p class="rep-note" id="rep-note">Текст сообщения скопируется. В Telegram вставьте его в комментарии канала.</p>
    <pre class="rep-pre" id="rep-pre" hidden></pre>
  </div></div>
  <div class="kbd">Клавиши: 1–${q.opts.length} — ответ, Enter — далее, Esc — меню</div>
  </div>`;
  app.querySelector('#back').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.l));
  const ro=app.querySelector('#rep-open'),rb=app.querySelector('#rep');
  ro.onclick=()=>{rb.hidden=!rb.hidden;ro.setAttribute('aria-expanded',!rb.hidden);if(!rb.hidden)app.querySelector('#rep-text').focus()};
  app.querySelector('#rep-text').addEventListener('keydown',e=>e.stopPropagation());
  app.querySelector('#rep-send').onclick=()=>{
    const o=q.opts.find(o=>o.l===q.ans),c=app.querySelector('#rep-text').value.trim();
    const msg=`Ошибка в вопросе (тренажёр, версия ${VER})\nБилет № ${q.t}, вопрос ${q.n}\n«${q.text}»\nОтвет по таблице: ${q.ans}) ${o?o.text:''}\nКомментарий: ${c||'—'}`.replace(/\u00a0/g,' ');
    copyText(msg,app.querySelector('#rep-pre'),app.querySelector('#rep-note'),'Сообщение скопировано. В Telegram вставьте его в комментарии канала.');
  };
  window.scrollTo(0,0);
}
function pick(l){
  if(S.picked)return;const q=S.qs[S.i];S.picked=l;const ok=l===q.ans;
  S.res.push({id:q.id,ok,picked:l});
  const set=new Set(store.wrong);
  if(ok){if(S.mode==='err'||S.mode==='goal')set.delete(q.id)}else set.add(q.id);
  const r=store.stat[q.id]||(store.stat[q.id]={c:0,w:0,last:0});if(ok)r.c++;else r.w++;r.last=ok?1:0;
  store.wrong=[...set];save();
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const L=b.dataset.l;
    if(L===q.ans)b.classList.add('ok');else if(L===l)b.classList.add('bad');else b.classList.add('dim')});
  const v=app.querySelector('#verdict');v.className='verdict '+(ok?'ok':'bad');
  v.textContent=ok?'Верно':'Неверно. Правильный ответ: '+q.ans+')';
  const last=S.i===S.qs.length-1;
  app.querySelector('#nextbox').innerHTML=`<button class="next" id="next">${last?'Показать результат':'Следующий вопрос →'}</button>`;
  const n=app.querySelector('#next');n.onclick=next;n.focus({preventScroll:true});
}
function next(){if(S.i<S.qs.length-1){S.i++;question()}else result()}
function result(){
  const good=S.res.filter(r=>r.ok).length,tot=S.res.length,bad=S.res.filter(r=>!r.ok);
  if(S.mode==='ticket'){const p=store.best[S.ticket];if(p==null||good>p)store.best[S.ticket]=good}
  store.sessions.push({d:Date.now(),title:S.title,good,tot});if(store.sessions.length>200)store.sessions.shift();save();
  const st=summary();
  const pass=bad.length===0;
  app.innerHTML=`<div class="screen">
  <div class="bar"><button class="back" id="back">← Меню</button><div class="where">${esc(S.title)}</div></div>
  <div class="score"><span class="big">${good}</span><span class="of">из ${tot} верно</span>
  <span class="stamp ${pass?'ok':'bad'}">${pass?'Без ошибок':bad.length+' '+plural(bad.length,'ошибка','ошибки','ошибок')}</span></div>
  <div class="actions">
    <button class="go" id="again">${S.mode==='exam'?'Новый экзамен':'Пройти ещё раз'}</button>
    ${store.wrong.length?`<button id="toerr">Работа над ошибками (${store.wrong.length})</button>`:''}
  </div>
  <button class="goal" id="m-stats" style="margin-top:18px"><div class="goal-top"><span class="goal-pct">${st.pct}%</span><span class="goal-cap">освоено всего · цель 100%</span><span class="goal-more">Статистика →</span></div>${meter(st)}</button>
  ${bad.length?`<div class="label">Разбор ошибок</div><div class="misslist">${bad.map(r=>{const q=byId[r.id];
    const ot=L=>{const o=q.opts.find(o=>o.l===L);return o?o.text:''};
    return `<div class="miss"><div class="qsrc">Билет ${q.t} · вопрос ${q.n}</div><div class="q">${esc(q.text)}</div>
    <div class="y">Ваш ответ: ${r.picked}) ${esc(ot(r.picked))}</div><div class="c">Правильно: ${q.ans}) ${esc(ot(q.ans))}</div></div>`}).join('')}</div>`:''}
  </div>`;
  app.querySelector('#back').onclick=home;
  app.querySelector('#m-stats').onclick=stats;
  app.querySelector('#again').onclick=()=>{const m=S.mode;
    if(m==='exam')start('exam',shuffle(ALL).slice(0,9),'Экзамен');
    else if(m==='goal'){const q=shuffle(ALL.filter(q=>!(store.stat[q.id]&&store.stat[q.id].last)));q.length?start('goal',q,S.title):home()}
    else if(m==='err'){const q=shuffle(store.wrong.map(id=>byId[id]));q.length?start('err',q,S.title):home()}
    else start(m,m==='all'?shuffle(ALL):S.qs,S.title,S.ticket)};
  const te=app.querySelector('#toerr');if(te)te.onclick=()=>start('err',shuffle(store.wrong.map(id=>byId[id])),'Работа над ошибками');
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!S)return;
  if(e.key==='Escape'){home();return}
  const q=S.qs[S.i];if(!q)return;
  if(!S.picked){let k=-1;if(/^[1-6]$/.test(e.key))k=+e.key-1;else k=LET.indexOf(e.key.toLowerCase());
    if(k>=0&&q.opts[k]){e.preventDefault();pick(q.opts[k].l)}}
  else if(e.key==='Enter'&&document.activeElement?.id!=='next'){e.preventDefault();next()}
});
home();
</script>
